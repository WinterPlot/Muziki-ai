apply plugin: 'com.android.application'

android {
    namespace "com.mayuto.dev.muziki"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.mayuto.dev.muziki"
        minSdkVersion 21
        targetSdkVersion 35

        // Technical version incremented for the video search + Picture-in-Picture upgrade
        versionCode 13

        // Visible version updated to reflect this upgrade
        versionName "2.5.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
