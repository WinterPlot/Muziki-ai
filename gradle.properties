# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# This app uses AndroidX/AppCompat, so the Android Gradle Plugin must resolve
# AndroidX dependencies correctly. Keep Jetifier enabled so any legacy support
# library references are migrated automatically when needed.
android.useAndroidX=true
android.enableJetifier=true

android.nonTransitiveRClass=true
